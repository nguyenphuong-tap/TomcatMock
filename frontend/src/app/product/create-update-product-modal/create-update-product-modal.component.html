<dialog #productFormDialog class="custom-dialog">
    <div class="dialog-header">
        <h3>{{ isEditMode ? 'CẬP NHẬT SẢN PHẨM' : 'THÊM SẢN PHẨM MỚI' }}</h3>
        <button type="button" class="btn-close" (click)="closeDialog()">&times;</button>
    </div>

    <form *ngIf="productData" (ngSubmit)="onSubmit()">
        <div class="dialog-body">
            <div class="form-group">
                <label>Tên sản phẩm <span class="required">*</span></label>
                <input
                        type="text"
                        [(ngModel)]="productData.name"
                        name="name"
                        placeholder="Nhập tên sản phẩm"
                        required>
            </div>

            <div class="form-group">
                <label>Giá bán (VNĐ) <span class="required">*</span></label>
                <input
                        type="number"
                        [(ngModel)]="productData.price"
                        name="price"
                        min="0"
                        required>
            </div>

            <div class="form-group">
                <label>Số lượng <span class="required">*</span></label>
                <input
                        type="number"
                        [(ngModel)]="productData.quantity"
                        name="quantity"
                        min="0"
                        required>
            </div>
        </div>

        <div class="dialog-footer">
            <button type="button" class="btn-cancel" (click)="closeDialog()">Hủy</button>
            <button type="submit" [class]="isEditMode ? 'btn-submit btn-warning' : 'btn-submit btn-success'">
                {{ isEditMode ? 'Cập Nhật' : 'Thêm Mới' }}
            </button>
        </div>
    </form>
</dialog>
