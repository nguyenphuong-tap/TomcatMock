<dialog #productFormDialog class="custom-dialog">
    <div class="dialog-header">
        <h3>{{ isEditMode ? 'UPDATE PRODUCT' : 'ADD NEW PRODUCT' }}</h3>
        <button type="button" class="btn-close" (click)="closeDialog()">&times;</button>
    </div>

    <form *ngIf="productData" (ngSubmit)="onSubmit()" novalidate>
        <div class="dialog-body">
            <div class="form-group">
                <label for="product-name">Product name <span class="required">*</span></label>
                <input
                        id="product-name"
                        type="text"
                        [(ngModel)]="productData.name"
                        name="name"
                        placeholder="Enter a product name"
                        [attr.aria-invalid]="submitted && !!nameError"
                        [attr.aria-describedby]="submitted && nameError ? 'product-name-error' : null"
                        required>
                <p *ngIf="submitted && nameError" id="product-name-error" class="field-error" role="alert">{{ nameError }}</p>
            </div>

            <div class="form-group">
                <label for="product-price">Sale price (VND) <span class="required">*</span></label>
                <input
                        id="product-price"
                        type="number"
                        [(ngModel)]="productData.price"
                        name="price"
                        min="0"
                        step="any"
                        [attr.aria-invalid]="submitted && !!priceError"
                        [attr.aria-describedby]="submitted && priceError ? 'product-price-error' : null"
                        required>
                <p *ngIf="submitted && priceError" id="product-price-error" class="field-error" role="alert">{{ priceError }}</p>
            </div>

            <div class="form-group">
                <label for="product-quantity">Quantity <span class="required">*</span></label>
                <input
                        id="product-quantity"
                        type="number"
                        [(ngModel)]="productData.quantity"
                        name="quantity"
                        min="0"
                        step="1"
                        max="2147483647"
                        [attr.aria-invalid]="submitted && !!quantityError"
                        [attr.aria-describedby]="submitted && quantityError ? 'product-quantity-error' : null"
                        required>
                <p *ngIf="submitted && quantityError" id="product-quantity-error" class="field-error" role="alert">{{ quantityError }}</p>
            </div>
        </div>

        <div class="dialog-footer">
            <button type="button" class="btn-cancel" (click)="closeDialog()">Cancel</button>
            <button type="submit" [disabled]="!hasRequiredFields"
                    [class]="isEditMode ? 'btn-submit btn-warning' : 'btn-submit btn-success'">
                {{ isEditMode ? 'Update' : 'Add' }}
            </button>
        </div>
    </form>
</dialog>
