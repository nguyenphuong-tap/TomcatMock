<dialog #deleteDialog class="custom-dialog" aria-labelledby="delete-product-title"
        aria-describedby="delete-product-description" (cancel)="closeDialog()">
    <div class="dialog-header">
        <h3 id="delete-product-title">CONFIRM PRODUCT DELETION</h3>
        <button type="button" class="btn-close" aria-label="Close" (click)="closeDialog()">&times;</button>
    </div>
    <div class="dialog-body" id="delete-product-description">
        <p>Are you sure you want to delete <strong>{{ product?.name }}</strong>
            (ID {{ product?.id }})?</p>
        <p class="delete-warning">This action cannot be undone.</p>
    </div>
    <div class="dialog-footer">
        <button type="button" class="btn-cancel" autofocus (click)="closeDialog()">Cancel</button>
        <button type="button" class="btn-danger" (click)="confirmDelete()">Delete product</button>
    </div>
</dialog>
